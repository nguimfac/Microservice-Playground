server:
    port: 9000

# POSTGRESQL CONFIG
spring:
    application:
        name: payment-service
    datasource:
        url: jdbc:postgresql://localhost:5432/payment-db
        username: root
        password: root
        driver-class-name: org.postgresql.Driver
    jpa:
        hibernate:
            ddl-auto: update
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect
        show-sql: true
eureka:
    client:
        register-with-eureka: false
        fetch-registry: false