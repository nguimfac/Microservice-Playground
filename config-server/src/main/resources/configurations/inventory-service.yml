server:
  port: 8081
#DB CONNECTION
spring:
  datasource:
    url: jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: inventory_user
    password: inventory_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect


#CIRCUIT BREAKER CONFIG
management:
  health:
    circuitbreakers:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

resilience4j:
  circuitbreaker:
    instances:
      inventory:
        registerHealthIndicator: true
        event-consumer-buffer-size: 10
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 5s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

  #TIMEOUT
  timelimiter:
    instances:
      inventory:
        timeout-duration: 3s

  #RETRY
  retry:
    instances:
      inventory:
        maxAttempts: 3
        waitDuration: 5s

#EUREKA REGISTRATION
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true