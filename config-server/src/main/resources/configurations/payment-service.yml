server:
  port: 9000

# POSTGRESQL CONFIG
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/payment-db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true