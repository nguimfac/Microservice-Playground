# MYSQL CONFIG
server:
  port: 8082
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: order_user
    password: order_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true


resilience4j:
  circuitbreaker:
    instances:
      inventory:
        registerHealthIndicator: true              # Activer un indicateur de santé pour Actuator
        event-consumer-buffer-size: 10            # Taille du buffer pour stocker les événements du circuit breaker
        slidingWindowType: COUNT_BASED            # Type de fenêtre pour calculer le taux d’échec (COUNT_BASED = basé sur le nombre d'appels)
        slidingWindowSize: 5                       # Nombre d'appels à considérer pour calculer le taux d’échec
        failureRateThreshold: 50                   # % d’échecs avant d’ouvrir le circuit breaker
        waitDurationInOpenState: 5s                # Durée pendant laquelle le circuit reste ouvert avant de passer à HALF_OPEN
        permittedNumberOfCallsInHalfOpenState: 3  # Nombre d’appels autorisés quand le circuit est HALF_OPEN
        automaticTransitionFromOpenToHalfOpenEnabled: true # Transition automatique du circuit de OPEN à HALF_OPEN

  #TIMEOUT
  timelimiter:
    instances:
      inventory:
        timeout-duration: 10s

  #RETRY
  retry:
    instances:
      inventory:
        maxAttempts: 3
        waitDuration: 20s
