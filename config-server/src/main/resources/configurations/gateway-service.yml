server:
  port: 8080
eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/

# GATEWAY ROUTES MAPPING CONFIG
spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
                enabled: true
                lowerCaseServiceId: true
            routes:
              - id: payment
                uri: lb://PAYMENT
                predicates:
                  - Path=/api/payment/**
